apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gym-frontend-ingress
  namespace: gym
  annotations:
    managed-by: kustomize
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gym-frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gym-backend-service
                port:
                  number: 8080